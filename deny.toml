# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
db-path = "/usr/local/cargo/advisory-db-pinned"
ignore = [
    # Transitive via nalgebra → simba; no patched release on our toolchain yet.
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained (nalgebra 0.33)" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "warn"

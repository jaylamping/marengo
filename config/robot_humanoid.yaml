# Marengo humanoid (23 DOF, G1-class proportions, 1524 mm).
# Template only: it does not boot. `urdf` still points at the 5-DOF arm URDF (no 23-joint
# URDF exists yet) and there is no control or homing template. Before M6 it needs a full
# URDF, control.yaml and homing.yaml rows and the bus/ID plan (hardware ADR 0001).
# See hardware/docs/kinematics.md for link dimensions and limits.
robot:
  urdf: assets/urdf/marengo.urdf
  bench:
    max_joint_torque_nm: 5.0
  joints:
    - waist_yaw
    - left_hip_yaw
    - left_hip_roll
    - left_hip_pitch
    - left_knee
    - left_ankle_pitch
    - left_ankle_roll
    - right_hip_yaw
    - right_hip_roll
    - right_hip_pitch
    - right_knee
    - right_ankle_pitch
    - right_ankle_roll
    - left_shoulder_pitch
    - left_shoulder_roll
    - left_upper_arm_yaw
    - left_elbow
    - left_wrist
    - right_shoulder_pitch
    - right_shoulder_roll
    - right_upper_arm_yaw
    - right_elbow_pitch
    - right_lower_arm_yaw
  limbs:
    torso:
      - waist_yaw
    left_leg:
      - left_hip_yaw
      - left_hip_roll
      - left_hip_pitch
      - left_knee
      - left_ankle_pitch
      - left_ankle_roll
    right_leg:
      - right_hip_yaw
      - right_hip_roll
      - right_hip_pitch
      - right_knee
      - right_ankle_pitch
      - right_ankle_roll
    left_arm:
      - left_shoulder_pitch
      - left_shoulder_roll
      - left_upper_arm_yaw
      - left_elbow
      - left_wrist
    right_arm:
      - right_shoulder_pitch
      - right_shoulder_roll
      - right_upper_arm_yaw
      - right_elbow_pitch
      - right_lower_arm_yaw

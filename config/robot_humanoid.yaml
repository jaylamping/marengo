# Marengo humanoid (23 DOF, G1-class proportions, 1524 mm).
# Switch robot.yaml to this file when full-body CAN is commissioned.
# See hardware/docs/kinematics.md for link dimensions and limits.
robot:
  name: marengo_humanoid
  urdf: assets/urdf/marengo.urdf
  bench:
    max_joint_velocity_rad_s: 0.5
    max_joint_torque_nm: 5.0
  joints:
    - waist_yaw
    - left_hip_yaw
    - left_hip_roll
    - left_hip_pitch
    - left_knee
    - left_ankle_pitch
    - left_ankle_roll
    - right_hip_yaw
    - right_hip_roll
    - right_hip_pitch
    - right_knee
    - right_ankle_pitch
    - right_ankle_roll
    - left_shoulder_pitch
    - left_shoulder_roll
    - left_upper_arm_yaw
    - left_elbow
    - left_wrist
    - right_shoulder_pitch
    - right_shoulder_roll
    - right_upper_arm_yaw
    - right_elbow_pitch
    - right_lower_arm_yaw

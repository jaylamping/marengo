# Control tuning and safety rules (OpenArm-style MIT).
# See docs/decisions/0004-control-modes-and-mit.md

control:
  loop_hz: 200
  chappe_state_hz: 50
  comm_watchdog_ms: 50
  feedback_poll_budget_us: 3000
  feedback_drain_quiet_us: 300
  tau_ff_rate_limit_nm_per_s: 20.0
  disable_on_exit: true
  bench:
    allow_firmware_speed_mode: false
    active_reporting_diagnostics: false

  motor_type_defaults:
    rs00:
      kp_max: 500
      kd_max: 5
      tau_ff_max_nm: 3.0
      velocity_max_rad_s: 2.0
    rs02:
      kp_max: 500
      kd_max: 5
      tau_ff_max_nm: 3.0
      velocity_max_rad_s: 2.0
    rs03:
      kp_max: 5000
      kd_max: 100
      tau_ff_max_nm: 5.0
      velocity_max_rad_s: 2.0
    rs04:
      kp_max: 5000
      kd_max: 100
      tau_ff_max_nm: 5.0
      velocity_max_rad_s: 1.5

  joints:
    shoulder_roll:
      motor_type: rs03
      gravity_comp:
        kp: 0.0
        kd: 0.0
        ki: 0.0
      impedance:
        kp: 50.0
        kd: 2.0
        ki: 0.0
      friction:
        fc: 0.0
        fv: 0.0
        fo: 0.0
        k: 10.0
    shoulder_pitch:
      motor_type: rs03
      gravity_comp:
        kp: 0.0
        kd: 0.0
        ki: 0.0
      impedance:
        kp: 12.0
        kd: 0.75
        ki: 0.0
      position_slew_rad_s: 15.0
      position_slew_max_lead_rad: 0.5
      position_hold_trim_rad: 0.0
      friction:
        fc: 0.0
        fv: 0.0
        fo: 0.0
        k: 10.0
    upper_arm_yaw:
      motor_type: rs02
      gravity_comp:
        kp: 0.0
        kd: 0.0
        ki: 0.0
      impedance:
        kp: 20.0
        kd: 1.0
        ki: 0.0
      friction:
        fc: 0.0
        fv: 0.0
        fo: 0.0
        k: 10.0
    elbow:
      motor_type: rs02
      gravity_comp:
        kp: 0.0
        kd: 0.0
        ki: 0.0
      impedance:
        kp: 20.0
        kd: 1.0
        ki: 0.0
      friction:
        fc: 0.0
        fv: 0.0
        fo: 0.0
        k: 10.0

  danger_zones:
    - name: elevated_shoulder_pitch_fall
      joint: shoulder_pitch
      position_above_rad: 0.5
      velocity_below_rad_s: -0.1
      action: clamp_velocity
      max_velocity_rad_s: 0.05

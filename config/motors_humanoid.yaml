# Humanoid joint → CAN mapping (23 DOF).
# Not loaded by default — copy/rename to motors.yaml when commissioning full body.
# motor_type per hardware/docs/decisions/0002-robstride-protocol.md
# Joint names and limits must match hardware/docs/kinematics.md
# Command velocity caps: control.yaml only (joint → actuator_groups → motor_type_defaults). ADR 0010.
motors:
  # --- Left leg (device_id 1–6, can0) ---
  - joint: left_hip_yaw
    driver: robstride
    motor_type: rs03
    can_interface: can0
    device_id: 1
    direction: 1
    gear_ratio: 1.0
    recv_can_id: 0x240
    firmware_version: "0.0.0-humanoid"
    bench:
      position_lower_rad: -2.76
      position_upper_rad: 2.76
      velocity_limit_rad_s: 0.5
      torque_limit_nm: 5.0
  - joint: left_hip_roll
    driver: robstride
    motor_type: rs03
    can_interface: can0
    device_id: 2
    direction: 1
    gear_ratio: 1.0
    recv_can_id: 0x241
    firmware_version: "0.0.0-humanoid"
    bench:
      position_lower_rad: -0.52
      position_upper_rad: 2.97
      velocity_limit_rad_s: 0.5
      torque_limit_nm: 5.0
  - joint: left_hip_pitch

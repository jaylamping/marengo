# Per-joint homing and zero reference (ADR 0006).
# See docs/homing.md

homing:
  zero_verify_tolerance_rad: 0.05
  calibration_record_path: var/calibration/zero_registry.yaml

  defaults:
    method: manual_reference
    home_offset_rad: 0.0
    search_direction: positive
    search_velocity_rad_s: 0.15
    search_torque_nm: 0.5
    search_timeout_s: 30.0
    backoff_rad: 0.05
    sign_test_required: true
    allow_sensor_overlap: false

  joints:
    shoulder_roll:
      method: manual_reference
      # Target when Hall hardware installed:
      # method: hall_three_sensor
      # home_offset_rad: 0.0
      # sensors:
      #   home: { gpio: 23, active_high: true }
      #   min_limit: { gpio: 24, active_high: true }
      #   max_limit: { gpio: 25, active_high: true }
    shoulder_pitch:
      method: manual_reference
    upper_arm_yaw:
      method: manual_reference
    elbow:
      method: manual_reference

homing:
  zero_verify_tolerance_rad: 0.05
  # Only locates the reference journal (reference-journal.sqlite3 in this directory).
  # The zero_registry.yaml file itself is retired and never read (docs/homing.md).
  calibration_record_path: /opt/marengo/var/calibration/zero_registry.yaml
  defaults:
    home_offset_rad: 0.0
    search_direction: positive
    search_velocity_rad_s: 0.15
    search_torque_nm: 0.5
    search_timeout_s: 30.0
    backoff_rad: 0.05
    sign_test_required: true
    allow_sensor_overlap: false
  joints:
    right_shoulder_roll:
      method: manual_reference
    right_shoulder_pitch:
      method: manual_reference
    right_upper_arm_yaw:
      method: manual_reference
    right_elbow_pitch:
      method: manual_reference
    right_lower_arm_yaw:
      method: manual_reference

# Robot runtime parameters (4-DOF arm bring-up — first wired humanoid subsystem)
robot:
  name: marengo_arm_4dof
  urdf: assets/urdf/arm_4dof.urdf
  bench:
    max_joint_velocity_rad_s: 0.5
    max_joint_torque_nm: 5.0
  joints:
    - shoulder_roll
    - shoulder_pitch
    - upper_arm_yaw
    - elbow

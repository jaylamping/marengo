# Master hardware description — right 4-DOF bench (roll + pitch + yaw + elbow on can0).
# Durable SoT: root config/ + assets/urdf/marengo.urdf (Pi: /opt/marengo/config/).
robot:
  name: marengo_arm_4dof_right
  urdf: assets/urdf/marengo.urdf
  bench:
    max_joint_velocity_rad_s: 2.0
    max_joint_torque_nm: 5.0
  joints:
    - right_shoulder_roll
    - right_shoulder_pitch
    - right_upper_arm_yaw
    - right_elbow_pitch
  # Anatomical membership for Joint→Limb→Robot Ready aggregation.
  # Limb members may include unbuilt Offline inventory; those do not block Ready.
  limbs:
    right_arm:
      - right_shoulder_roll
      - right_shoulder_pitch
      - right_upper_arm_yaw
      - right_elbow_pitch
      - right_lower_arm_yaw
    left_arm:
      - left_shoulder_roll
      - left_shoulder_pitch
      - left_upper_arm_yaw
      - left_elbow
      - left_wrist

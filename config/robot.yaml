# Master hardware description — right 4-DOF bench (roll + pitch + yaw + elbow on can0).
# Durable SoT: root config/ + assets/urdf/marengo.urdf (Pi: /opt/marengo/config/).
robot:
  name: marengo_arm_4dof_right
  urdf: assets/urdf/marengo.urdf
  bench:
    max_joint_velocity_rad_s: 2.0
    max_joint_torque_nm: 5.0
  joints:
    - right_shoulder_roll
    - right_shoulder_pitch
    - right_upper_arm_yaw
    - right_elbow_pitch

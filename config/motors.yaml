# Right 5-DOF bench — pitch (1) + roll (2) + yaw (3) + elbow pitch (4) + lower-arm yaw (5) on can0.
# ID block: right arm 1–10 (hardware ADR 0001).
#
# Bench envelopes from Set Limits (2026-07-22) for DOF 1–4. Davout hard = URDF ∩ bench.
# Lower-arm yaw: provisional kinematics envelope until first Set Limits pass.
# Roll lower kept at URDF -0.05 (not flush to measured min) so home pose ~-0.01 enables.
motors:
  - joint: right_shoulder_pitch
    driver: robstride
    motor_type: rs03
    can_interface: can0
    device_id: 1
    direction: -1
    gear_ratio: 1.0
    recv_can_id: 0x241
    firmware_version: "0.3.1.42"
    bench:
      position_lower_rad: -1.1152385473251345
      position_upper_rad: 3.007078170776367
      velocity_limit_rad_s: 2.0
      torque_limit_nm: 5.0
  - joint: right_shoulder_roll
    driver: robstride
    motor_type: rs03
    can_interface: can0
    device_id: 2
    direction: 1
    gear_ratio: 1.0
    recv_can_id: 0x242
    firmware_version: "0.3.1.42"
    bench:
      position_lower_rad: -0.06788089871406555
      position_upper_rad: 3.1156094074249268
      velocity_limit_rad_s: 2.0
      torque_limit_nm: 5.0
  - joint: right_upper_arm_yaw
    driver: robstride
    motor_type: rs02
    can_interface: can0
    device_id: 3
    # Live sign check (2026-08-11): +q = outwards (match lower_arm_yaw).
    direction: -1
    gear_ratio: 1.0
    recv_can_id: 0x243
    firmware_version: "0.2.3.34"
    bench:
      position_lower_rad: -0.7746843099594116
      position_upper_rad: 1.290117621421814
      velocity_limit_rad_s: 2.0
      torque_limit_nm: 3.0
  - joint: right_elbow_pitch
    driver: robstride
    motor_type: rs02
    can_interface: can0
    device_id: 4
    # Live sign check (2026-08-11): motor +q lowered forearm; direction -1 so
    # joint +q = forearm up/forward (URDF +Y / playbook Wave band).
    direction: -1
    gear_ratio: 1.0
    recv_can_id: 0x244
    firmware_version: "0.2.3.34"
    bench:
      position_lower_rad: -0.15416957437992096
      position_upper_rad: 1.6072771549224854
      velocity_limit_rad_s: 1.0
      torque_limit_nm: 3.0
  - joint: right_lower_arm_yaw
    driver: robstride
    motor_type: rs00
    can_interface: can0
    device_id: 5
    # Live sign check (2026-08-11): +q = outwards, -q = inwards (operator).
    direction: -1
    gear_ratio: 1.0
    recv_can_id: 0x245
    firmware_version: "0.0.3.32"
    bench:
      # Kinematics envelope until measured Set Limits on the bench.
      position_lower_rad: -0.39424505829811096
      position_upper_rad: 3.2440848350524902
      velocity_limit_rad_s: 1.0
      torque_limit_nm: 3.0

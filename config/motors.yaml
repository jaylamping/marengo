# Left 4-DOF arm on can0 — device IDs 11–14 (see hardware ADR 0001).
# motor_type per hardware/docs/decisions/0002-robstride-protocol.md
motors:
  - joint: shoulder_roll
    driver: robstride
    motor_type: rs03
    can_interface: can0
    device_id: 11
    direction: 1
    gear_ratio: 1.0
    recv_can_id: 0x24b
    firmware_version: "0.3.1.42"
    bench:
      position_lower_rad: -1.57
      position_upper_rad: 1.57
      # DEPRECATED: command velocity caps come from control.yaml (ADR 0010).
      velocity_limit_rad_s: 0.5
      torque_limit_nm: 5.0
  - joint: shoulder_pitch
    driver: robstride
    motor_type: rs03
    can_interface: can0
    device_id: 12
    direction: 1
    gear_ratio: 1.0
    recv_can_id: 0x24c
    firmware_version: "0.3.1.42"
    bench:
      position_lower_rad: -0.9
      position_upper_rad: 3.17
      # DEPRECATED: command velocity caps come from control.yaml (ADR 0010).
      velocity_limit_rad_s: 0.5
      torque_limit_nm: 5.0
  - joint: upper_arm_yaw
    driver: robstride
    motor_type: rs02
    can_interface: can0
    device_id: 13
    direction: 1
    gear_ratio: 1.0
    recv_can_id: 0x24d
    firmware_version: "0.3.1.42"
    bench:
      position_lower_rad: -1.57
      position_upper_rad: 1.57
      # DEPRECATED: command velocity caps come from control.yaml (ADR 0010).
      velocity_limit_rad_s: 0.5
      torque_limit_nm: 3.0
  - joint: elbow
    driver: robstride
    motor_type: rs02
    can_interface: can0
    device_id: 14
    direction: 1
    gear_ratio: 1.0
    recv_can_id: 0x24e
    firmware_version: "0.3.1.42"
    bench:
      position_lower_rad: 0.0
      position_upper_rad: 2.5
      # DEPRECATED: command velocity caps come from control.yaml (ADR 0010).
      velocity_limit_rad_s: 0.5
      torque_limit_nm: 3.0

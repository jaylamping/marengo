# Right 2-DOF bench — roll (id 1) + pitch (id 2) on can0.
# ID block: right arm 1–10 (hardware ADR 0001).
motors:
  - joint: right_shoulder_roll
    driver: robstride
    motor_type: rs03
    can_interface: can0
    device_id: 1
    direction: 1
    gear_ratio: 1.0
    recv_can_id: 0x241
    firmware_version: "0.3.1.42"
    bench:
      position_lower_rad: -1.57
      position_upper_rad: 1.57
      velocity_limit_rad_s: 0.5
      torque_limit_nm: 5.0
  - joint: right_shoulder_pitch
    driver: robstride
    motor_type: rs03
    can_interface: can0
    device_id: 2
    # Right motor is mounted opposite the URDF +pitch convention; +pitch moves arm forward.
    direction: -1
    gear_ratio: 1.0
    recv_can_id: 0x242
    firmware_version: "0.3.1.42"
    bench:
      position_lower_rad: -0.9
      position_upper_rad: 3.17
      velocity_limit_rad_s: 2.0
      torque_limit_nm: 5.0

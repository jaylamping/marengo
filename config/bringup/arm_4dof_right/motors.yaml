# Right 4-DOF bench — roll (1) + pitch (2) + yaw (3) + elbow pitch (4) on can0.
# ID block: right arm 1–10 (hardware ADR 0001).
motors:
  - joint: right_shoulder_roll
    driver: robstride
    motor_type: rs03
    can_interface: can0
    device_id: 1
    direction: 1
    gear_ratio: 1.0
    recv_can_id: 0x241
    firmware_version: "0.3.1.42"
    bench:
      position_lower_rad: -0.05
      position_upper_rad: 3.14159
      velocity_limit_rad_s: 2.0
      torque_limit_nm: 5.0
  - joint: right_shoulder_pitch
    driver: robstride
    motor_type: rs03
    can_interface: can0
    device_id: 2
    direction: -1
    gear_ratio: 1.0
    recv_can_id: 0x242
    firmware_version: "0.3.1.42"
    bench:
      position_lower_rad: -0.9
      position_upper_rad: 3.25
      velocity_limit_rad_s: 2.0
      torque_limit_nm: 5.0
  - joint: right_upper_arm_yaw
    driver: robstride
    motor_type: rs02
    can_interface: can0
    device_id: 3
    direction: 1
    gear_ratio: 1.0
    recv_can_id: 0x243
    firmware_version: "0.3.1.42"
    bench:
      position_lower_rad: -1.57
      position_upper_rad: 1.57
      velocity_limit_rad_s: 2.0
      torque_limit_nm: 3.0
  - joint: right_elbow_pitch
    driver: robstride
    motor_type: rs02
    can_interface: can0
    device_id: 4
    # Provisional — verify motor vs URDF +Y with a low-gain jog after set-zero.
    direction: 1
    gear_ratio: 1.0
    recv_can_id: 0x244
    firmware_version: "0.3.1.42"
    bench:
      # Measured Set Limits sweep (2026-07-22). Keep within URDF elbow envelope
      # (Davout hard = URDF ∩ bench). Live pose was ~-0.23 at Enable.
      position_lower_rad: -0.50
      position_upper_rad: 0.95
      velocity_limit_rad_s: 1.0
      torque_limit_nm: 3.0

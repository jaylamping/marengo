# Dual shoulder pitch bench slice — left on can0, right on can1.
# Use: MARENGO_CONFIG_DIR=config/bringup/shoulder_pitch_dual marengo-pi
robot:
  name: marengo_shoulder_pitch_dual
  urdf: assets/urdf/shoulder_pitch_dual.urdf
  bench:
    max_joint_velocity_rad_s: 0.5
    max_joint_torque_nm: 5.0
  joints:
    - left_shoulder_pitch
    - right_shoulder_pitch

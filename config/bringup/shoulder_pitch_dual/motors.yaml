# Left shoulder pitch → can0, right → can1. Adjust device_id if firmware differs.
motors:
  - joint: left_shoulder_pitch
    driver: robstride
    motor_type: rs03
    can_interface: can0
    device_id: 1
    direction: 1
    gear_ratio: 1.0
    recv_can_id: 0x240
    firmware_version: "0.0.0-bench"
    bench:
      position_lower_rad: -1.2
      position_upper_rad: 1.2
      velocity_limit_rad_s: 0.5
      torque_limit_nm: 5.0
  - joint: right_shoulder_pitch
    driver: robstride
    motor_type: rs03
    can_interface: can1
    device_id: 1
    direction: 1
    gear_ratio: 1.0
    recv_can_id: 0x240
    firmware_version: "0.0.0-bench"
    bench:
      position_lower_rad: -1.2
      position_upper_rad: 1.2
      velocity_limit_rad_s: 0.5
      torque_limit_nm: 5.0

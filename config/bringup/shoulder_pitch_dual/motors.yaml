# Dual shoulder pitch — bench verified 2026-05 (robot frame).
#   right_shoulder_pitch  can0  device_id 2
#   left_shoulder_pitch   can1  device_id 12
# ID blocks: right arm 1–10, left arm 11–20.
motors:
  - joint: left_shoulder_pitch
    driver: robstride
    motor_type: rs03
    can_interface: can1
    device_id: 12
    direction: 1
    gear_ratio: 1.0
    recv_can_id: 0x24c
    firmware_version: "0.3.1.42"
    bench:
      position_lower_rad: -1.2
      position_upper_rad: 1.65
      velocity_limit_rad_s: 0.5
      torque_limit_nm: 5.0
  - joint: right_shoulder_pitch
    driver: robstride
    motor_type: rs03
    can_interface: can0
    device_id: 2
    direction: 1
    gear_ratio: 1.0
    recv_can_id: 0x242
    firmware_version: "0.3.1.42"
    bench:
      position_lower_rad: -1.2
      position_upper_rad: 1.65
      velocity_limit_rad_s: 0.5
      torque_limit_nm: 5.0

# Control tuning for right-only shoulder pitch bring-up.
control:
  loop_hz: 200
  chappe_state_hz: 25
  comm_watchdog_ms: 50
  tau_ff_rate_limit_nm_per_s: 20.0
  disable_on_exit: true
  bench:
    allow_firmware_speed_mode: false

  motor_type_defaults:
    rs03:
      kp_max: 5000
      kd_max: 100
      tau_ff_max_nm: 5.0
      velocity_max_rad_s: 2.0

  actuator_groups:
    shoulder_pitch:
      joints: [right_shoulder_pitch]
      velocity_max_rad_s: 2.0

  joints:
    right_shoulder_pitch:
      motor_type: rs03
      gravity_comp:
        kp: 0.0
        kd: 0.0
        ki: 0.0
      impedance:
        kp: 12.0
        kd: 3.0
        ki: 2.0
      # Always trapezoid (ADR 0007 one-pass); small moves cap v_max at position_slew_rad_s.
      position_slew_rad_s: 0.15
      position_slew_max_lead_rad: 0.15
      position_trajectory_threshold_rad: 0.15
      # 0→90°: v=1.45 a=4.5 — longer decel; tighter max_lead + lower kp reduce coast past target.
      position_trajectory_velocity_rad_s: 1.45
      position_trajectory_accel_rad_s2: 4.5
      position_trajectory_velocity_deadband_rad: 0.02
      # Bench trim stays zero after set-zero at mechanical arm-down.
      position_hold_trim_rad: 0.0
      # ADR 0009 velocity-scaled limit envelope (soft bounds from URDF safety_controller).
      position_limit_margin_min_rad: 0.01
      position_limit_margin_k_v_s: 0.02
      position_limit_margin_k_stop: 0.5
      position_limit_measured_fault_slack_rad: 0.005
      friction:
        fc: 0.08
        fv: 0.0
        fo: 0.0
        k: 10.0

  danger_zones: []

  wrong_sign_watchdog:
    enabled: true
    expected_sign_at_positive_q: -1
    min_velocity_rad_s: 0.05
    min_opposition_ticks: 10
    grace_period_ticks: 20

# Weighted single-arm shoulder pitch — one side carries measured fixture mass.
# Use: MARENGO_CONFIG_DIR=config/bringup/shoulder_pitch_weighted marengo-pi
robot:
  name: marengo_shoulder_pitch_weighted
  urdf: assets/urdf/shoulder_pitch_weighted.urdf
  bench:
    max_joint_velocity_rad_s: 0.5
    max_joint_torque_nm: 5.0
  joints:
    - left_shoulder_pitch
    - right_shoulder_pitch

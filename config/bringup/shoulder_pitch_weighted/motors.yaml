# Dual shoulder pitch — same commissioned bus map as shoulder_pitch_dual.
# Update loaded side mass/COM in shoulder_pitch_weighted.urdf after scale measurement.
motors:
  - joint: left_shoulder_pitch
    driver: robstride
    motor_type: rs03
    can_interface: can1
    device_id: 12
    direction: 1
    gear_ratio: 1.0
    recv_can_id: 0x24c
    firmware_version: "0.3.1.42"
    bench:
      position_lower_rad: -1.2
      position_upper_rad: 1.2
      velocity_limit_rad_s: 0.5
      torque_limit_nm: 5.0
  - joint: right_shoulder_pitch
    driver: robstride
    motor_type: rs03
    can_interface: can0
    device_id: 2
    direction: 1
    gear_ratio: 1.0
    recv_can_id: 0x242
    firmware_version: "0.3.1.42"
    bench:
      position_lower_rad: -1.2
      position_upper_rad: 1.2
      velocity_limit_rad_s: 0.5
      torque_limit_nm: 5.0

# Left 4-DOF arm on can0 — Milestone B (device IDs 11–14).
# Use: MARENGO_CONFIG_DIR=config/bringup/arm_4dof_left
robot:
  name: marengo_arm_4dof_left
  urdf: assets/urdf/arm_4dof.urdf
  bench:
    max_joint_velocity_rad_s: 0.5
    max_joint_torque_nm: 5.0
  joints:
    - shoulder_roll
    - shoulder_pitch
    - upper_arm_yaw
    - elbow

# Right 3-DOF bench — shoulder roll + pitch + upper-arm yaw on can0.
# Use: MARENGO_CONFIG_DIR=config/bringup/arm_3dof_right marengo-pi
robot:
  name: marengo_arm_3dof_right
  urdf: assets/urdf/arm_3dof_right.urdf
  bench:
    max_joint_velocity_rad_s: 2.0
    max_joint_torque_nm: 5.0
  joints:
    - right_shoulder_roll
    - right_shoulder_pitch
    - right_upper_arm_yaw

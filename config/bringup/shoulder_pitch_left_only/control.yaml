# Control tuning for left-only shoulder pitch bring-up (mirrors right-only bench).
control:
  loop_hz: 200
  chappe_state_hz: 50
  comm_watchdog_ms: 50
  tau_ff_rate_limit_nm_per_s: 20.0
  disable_on_exit: true
  bench:
    allow_firmware_speed_mode: false

  motor_type_defaults:
    rs03:
      kp_max: 5000
      kd_max: 100
      tau_ff_max_nm: 5.0
      velocity_max_rad_s: 2.0

  actuator_groups:
    shoulder_pitch:
      joints: [left_shoulder_pitch]
      velocity_max_rad_s: 2.0

  joints:
    left_shoulder_pitch:
      motor_type: rs03
      gravity_comp:
        kp: 0.0
        kd: 0.0
      impedance:
        kp: 12.0
        kd: 0.75
      # hold-at / retarget: ramp setpoint at this rate (rad/s) instead of stepping instantly.
      position_slew_rad_s: 15.0
      position_slew_max_lead_rad: 0.5
      # Bench trim stays zero after set-zero at mechanical arm-down.
      position_hold_trim_rad: 0.0
      position_limit_margin_min_rad: 0.01
      position_limit_margin_k_v_s: 0.02
      position_limit_margin_k_stop: 0.5
      position_limit_measured_fault_slack_rad: 0.005
      friction:
        fc: 0.0
        fv: 0.0
        fo: 0.0
        k: 10.0

  danger_zones: []

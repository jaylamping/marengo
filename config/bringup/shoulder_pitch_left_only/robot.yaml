# Single left shoulder pitch for isolated bench bring-up.
# Use: MARENGO_CONFIG_DIR=config/bringup/shoulder_pitch_left_only marengo-pi
robot:
  name: marengo_shoulder_pitch_left_only
  urdf: assets/urdf/shoulder_pitch_left_bare.urdf
  bench:
    max_joint_velocity_rad_s: 0.5
    max_joint_torque_nm: 5.0
  joints:
    - left_shoulder_pitch

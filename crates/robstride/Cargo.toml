[package]
name = "robstride"
version = "0.1.0"
description = "Robstride actuator driver (CAN)"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
socketcan = ["dep:socketcan", "dep:nix"]

[dependencies]
marengo-config = { workspace = true }
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
socketcan = { version = "3", optional = true }
# Same nix as socketcan 3 (which enables `net`); `uio` adds recvmsg for kernel
# receive timestamps. Safe wrappers only.
nix = { version = "0.29", default-features = false, features = ["socket", "uio"], optional = true }

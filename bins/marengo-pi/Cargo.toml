[package]
name = "marengo-pi"
version = "0.1.0"
description = "Marengo runtime on Raspberry Pi"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license = "MIT OR Apache-2.0"

[[bin]]
name = "marengo-pi"
path = "src/main.rs"

[dependencies]
berthier = { path = "../../crates/berthier" }
chappe = { path = "../../crates/chappe" }
davout = { path = "../../crates/davout" }
robstride = { path = "../../crates/robstride" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = "0.3"

[package]
name = "marengo-pi"
version = "0.1.0"
description = "Marengo runtime on Raspberry Pi"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
socketcan = ["robstride/socketcan"]
vcan = ["socketcan"]

[[bin]]
name = "marengo-pi"
path = "src/main.rs"

[dependencies]
berthier = { path = "../../crates/berthier" }
chappe = { path = "../../crates/chappe" }
marengo-config.workspace = true
marengo-support.workspace = true
robstride = { path = "../../crates/robstride" }
tracing.workspace = true

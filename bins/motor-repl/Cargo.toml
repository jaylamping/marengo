[package]
name = "motor-repl"
version = "0.1.0"
description = "One-shot bench motor CLI"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
socketcan = ["robstride/socketcan"]
vcan = ["socketcan"]

[[bin]]
name = "motor-repl"
path = "src/main.rs"

[dependencies]
armee-dynamics.workspace = true
berthier = { path = "../../crates/berthier" }
davout.workspace = true
marengo-config.workspace = true
marengo-support.workspace = true
robstride.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"

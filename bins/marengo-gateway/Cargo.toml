[package]
name = "marengo-gateway"
version = "0.1.0"
description = "Operator gateway: HTTP CRUD + WebTransport for Consul"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "marengo-gateway"
path = "src/main.rs"

[dependencies]
armee-proto.workspace = true
axum = { version = "0.8", features = ["json"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
bytes = "1"
chappe = { path = "../../crates/chappe" }
futures = "0.3"
marengo-config.workspace = true
marengo-candump = { workspace = true, features = ["robstride-enrichment"] }
marengo-support.workspace = true
marengo-store = { path = "../../crates/marengo-store" }
prost = { workspace = true }
quinn = "0.11"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
serde_yaml.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing.workspace = true
web-transport-quinn = { version = "0.11", default-features = true }
x509-parser = "0.16"
base64 = "0.22"
sha2 = "0.10"
time = { version = "0.3", features = ["std"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

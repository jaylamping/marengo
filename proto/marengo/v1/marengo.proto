syntax = "proto3";

package marengo.v1;

// Shared envelope metadata for Chappe topics (payload follows as encoded sub-message).
message Envelope {
  uint64 timestamp_ms = 1;
  string source_node = 2;
  string message_type = 3; // fully-qualified proto message name
  bytes payload = 4;
}

message Heartbeat {
  uint64 timestamp_ms = 1;
  string node_id = 2;
}

// Per-joint homing / reference lifecycle published on RobotState.
// UNSPECIFIED (0) means the publisher did not populate the field (old runtime gate).
enum JointHomingState {
  JOINT_HOMING_STATE_UNSPECIFIED = 0;
  JOINT_HOMING_STATE_UNHOMED = 1;
  JOINT_HOMING_STATE_HOMING = 2;
  JOINT_HOMING_STATE_VERIFIED = 3;
  JOINT_HOMING_STATE_FAULTED = 4;
}

message JointState {
  string name = 1;
  double position = 2;
  double velocity = 3;
  double effort = 4;
  float temperature_c = 5;  // motor casing temperature (°C)
  uint32 fault = 6;         // Robstride fault bitmask
  JointHomingState homing_state = 7;
  bool drive_active = 8;
  bool out_of_limits = 9;
  // Milliseconds from the underlying RX sample to publication. Presence in
  // RobotState means "heard recently" (free-drive TTL), not "grant live":
  // consumers must use this age, not mere presence, for liveness.
  uint64 sample_age_ms = 10;
}

message RobotState {
  uint64 timestamp_ms = 1;
  repeated JointState joints = 2;
}

// --- Sensors (torso IMU on Pi I2C) ---

enum ImuAccuracy {
  IMU_ACCURACY_UNSPECIFIED = 0;
  IMU_ACCURACY_UNRELIABLE = 1;
  IMU_ACCURACY_LOW = 2;
  IMU_ACCURACY_MEDIUM = 3;
  IMU_ACCURACY_HIGH = 4;
}

message ImuSample {
  uint64 timestamp_ms = 1;
  string frame_id = 2;
  double quaternion_i = 3;
  double quaternion_j = 4;
  double quaternion_k = 5;
  double quaternion_real = 6;
  ImuAccuracy accuracy = 7;
  // Optional linear acceleration (m/s²) and gyro (rad/s) when enabled on device.
  double accel_x_m_s2 = 8;
  double accel_y_m_s2 = 9;
  double accel_z_m_s2 = 10;
  double gyro_x_rad_s = 11;
  double gyro_y_rad_s = 12;
  double gyro_z_rad_s = 13;
  bool has_accel = 14;
  bool has_gyro = 15;
  // Monotonic per driver session, incremented only on new sensor samples.
  // Publishers emit only fresh samples; a repeated sequence (or a gap with no
  // publication) means the sensor is silent, never "holding the last pose".
  uint64 sample_seq = 16;
}

// --- Safety / enable (Spot-style surface, Marengo semantics) ---

enum OperationalMode {
  OPERATIONAL_MODE_UNSPECIFIED = 0;
  OPERATIONAL_MODE_DISABLED = 1;
  OPERATIONAL_MODE_READY = 2;   // homed, drives may be enabled on request
  OPERATIONAL_MODE_ACTIVE = 3;  // tracking commanded motion
}

enum FaultSeverity {
  FAULT_SEVERITY_UNSPECIFIED = 0;
  FAULT_SEVERITY_WARNING = 1;
  FAULT_SEVERITY_FAULT = 2;
  FAULT_SEVERITY_ESTOP = 3;
}

message Fault {
  string code = 1;
  string message = 2;
  FaultSeverity severity = 3;
  string joint = 4; // optional, empty if robot-wide
}

message SafetyState {
  uint64 timestamp_ms = 1;
  OperationalMode mode = 2;
  bool hardware_estop_asserted = 3;
  bool software_estop_latched = 4;
  repeated Fault active_faults = 5;
}

message EnableRequest {
  uint64 timestamp_ms = 1;
  string operator_id = 2;
  // Request transition toward ACTIVE (must be in READY, E-stop clear).
  bool enable = 3;
}

message HomingComplete {
  uint64 timestamp_ms = 1;
  string node_id = 2;
}

// Firmware SetZero for one joint (mechanical reference already positioned).
message SetZeroRequest {
  uint64 timestamp_ms = 1;
  string operator_id = 2;
  string joint = 3;
  // Server-side gate: must be true (UI/agent confirm). Reject otherwise.
  bool confirm = 4;
  // Operator attestation that sign/direction was checked (homing.yaml may require it).
  bool sign_test_passed = 5;
}

// Per-joint Active Reporting (Robstride type-24) lease for diagnostics / free-drive sensing.
enum ActiveReportingLeaseAction {
  ACTIVE_REPORTING_LEASE_ACTION_UNSPECIFIED = 0;
  ACTIVE_REPORTING_LEASE_ACTION_ACQUIRE = 1;
  ACTIVE_REPORTING_LEASE_ACTION_RENEW = 2;
  ACTIVE_REPORTING_LEASE_ACTION_RELEASE = 3;
}

message ActiveReportingLeaseRequest {
  uint64 timestamp_ms = 1;
  string operator_id = 2;
  string joint = 3;
  // Session / workflow key (bounded by gateway). Not a security boundary.
  string client_id = 4;
  ActiveReportingLeaseAction action = 5;
  // Client-minted opaque id; required for renew/release. Acquire upserts this id.
  string lease_id = 6;
}

// Light Hardware-page status solicit: Pi re-TX Disable (type-4) per loaded motor so
// each replies with OperationStatus (type-2). No continuous Active Reporting.
// Joint list is always the Pi's loaded motors.yaml — not client-supplied.
message MotorStatusPollRequest {
  uint64 timestamp_ms = 1;
  string operator_id = 2;
}

// --- Control / MIT (OpenArm-style; see ADR 0004) ---

enum ControlMode {
  CONTROL_MODE_UNSPECIFIED = 0;
  CONTROL_MODE_DISABLED = 1;
  CONTROL_MODE_GRAVITY_COMP = 2;
  CONTROL_MODE_IMPEDANCE = 3;
  CONTROL_MODE_POSITION = 4;
  CONTROL_MODE_TORQUE_ONLY = 5;
}

// One joint MIT command (maps to Robstride Mode 0 fields).
message MitJointCommand {
  string name = 1;
  double kp = 2;
  double kd = 3;
  double position = 4;
  double velocity = 5;
  double torque_ff = 6;
  double ki = 7;  // integral gain (Testing page)
  double fc = 8;  // Coulomb friction compensation (Testing page)
}

message MitCommandBatch {
  uint64 timestamp_ms = 1;
  ControlMode mode = 2;
  repeated MitJointCommand joints = 3;
}

// --- Operator gateway (Consul / marengo-gateway) ---

// First message on a WebTransport bidi stream: which Chappe topics to receive.
message GatewaySubscribe {
  repeated string topics = 1;
  // Runtime credential for sensitive topics; never a role claim or URL parameter.
  string runtime_credential = 2;
}

// First server frame, before topic envelopes. HTTP-style admission status.
message GatewaySubscriptionAdmission {
  uint32 status = 1;
  repeated string topics = 2;
}

// Structured log line for Consul log surfaces (topic: logs/structured).
message LogEvent {
  uint64 timestamp_ms = 1;
  string level = 2;   // trace | debug | info | warn | error
  string target = 3;  // tracing target, e.g. berthier::loop
  string message = 4;
  string session_id = 5; // bench session id when MARENGO_LOG_SESSION_ID set
  string fields_json = 6; // JSON object of tracing structured fields; empty when none
}

// --- Host metrics (Consul host cards; topics host/metrics/pi | host/metrics/jetson) ---

enum HostNodeRole {
  HOST_NODE_ROLE_UNSPECIFIED = 0;
  HOST_NODE_ROLE_PI = 1;
  HOST_NODE_ROLE_JETSON = 2;
}

enum ServiceState {
  SERVICE_STATE_UNSPECIFIED = 0;
  SERVICE_STATE_ACTIVE = 1;
  SERVICE_STATE_INACTIVE = 2;
  SERVICE_STATE_FAILED = 3;
}

message HostMetrics {
  uint64 timestamp_ms = 1;
  string hostname = 2;
  HostNodeRole node_role = 3;
  uint64 uptime_sec = 4;
  string kernel_version = 5;
  string os_pretty_name = 6;
  BuildInfo build = 7;

  CpuMetrics cpu = 10;
  MemoryMetrics memory = 11;
  LoadMetrics load = 12;
  ThermalMetrics thermal = 13;
  repeated DiskMetrics disks = 14;
  repeated NetworkInterfaceMetrics network = 15;
  repeated ServiceStatus services = 16;
  ChappeHealth chappe = 17;
  ClockMetrics clock = 18;

  oneof platform {
    PiPlatformMetrics pi = 20;
    JetsonPlatformMetrics jetson = 21;
  }

  uint64 log_disk_bytes = 30;
  uint64 log_disk_budget_bytes = 31;
  // True for the non-Linux dev stub: every section is synthetic, never live data.
  bool simulated = 32;
}

message BuildInfo {
  string deploy_rev = 1;
  string git_sha = 2;
  string semver = 3;
}

message ChappeHealth {
  bool ipc_connected = 1;
  bool gateway_reachable = 2;
  uint64 last_publish_age_ms = 3;
  IpcQueueHealth ipc_queue = 4;
  // Measured TCP-connect latency of the gateway HTTP probe that sets
  // gateway_reachable. Absent when the probe fails: unknown, never zero.
  optional double gateway_probe_latency_ms = 5;
}

// Runtime transport admission counters. Queued bytes exclude framing/object
// overhead and the one bounded publication currently owned by the writer.
message IpcQueueHealth {
  uint64 queued_items = 1;
  uint64 queued_payload_bytes = 2;
  uint64 item_capacity = 3;
  uint64 payload_byte_capacity = 4;
  uint64 oldest_age_ms = 5;
  uint64 accepted_total = 6;
  uint64 coalesced_total = 7;
  uint64 dropped_total = 8;
  uint64 admitted_disconnected_total = 9;
  uint64 max_payload_bytes = 10;
  uint64 max_in_flight_payload_bytes = 11;
  // Failed frame attempts have uncertain delivery and are never replayed.
  uint64 write_failures_total = 12;
  // State discarded unread past the age bound (a subset of dropped_total).
  uint64 expired_total = 13;
  // Admissions never queued (unknown topic, oversize payload, closed outbox):
  // excluded from dropped_total, which counts transport-pressure loss only.
  uint64 rejected_total = 14;
}

// Gateway-local IPC transition; receiving this retires prior producer facts.
// The generation is scoped to this gateway process, not a robot boot identity.
message RuntimeConnectionState {
  uint64 generation = 1;
  bool connected = 2;
}

// Broadcast loss retires observations; retained backlog is discarded too.
message RuntimeObservationGap {
  // Ring-reported loss, excluding additionally discarded backlog.
  uint64 lagged_envelopes = 1;
}

message ClockMetrics {
  string sync_source = 1;
  // Deprecated: never populated.
  double offset_ms = 2 [deprecated = true];
  bool synchronized = 3;
}

message CpuMetrics {
  double usage_percent = 1;
  uint32 core_count = 2;
  // Deprecated: no longer populated (it fabricated 0.0 for invalid samples). Use cores.
  repeated double per_core_usage_percent = 3 [deprecated = true];
  uint32 freq_mhz = 4;
  double iowait_percent = 5;
  // False for a new baseline, reset, zero delta or unavailable counters.
  bool sample_valid = 6;
  // CPU IDs remain stable across sparse numbering and hotplug.
  repeated CpuCoreMetrics cores = 7;
}

message CpuCoreMetrics {
  uint32 cpu_id = 1;
  // Absent until this CPU has two valid monotonic observations.
  optional double usage_percent = 2;
}

message MemoryMetrics {
  uint64 total_bytes = 1;
  uint64 used_bytes = 2;
  uint64 available_bytes = 3;
  uint64 buffers_bytes = 4;
  uint64 cached_bytes = 5;
  uint64 swap_total_bytes = 6;
  uint64 swap_used_bytes = 7;
  // False when /proc/meminfo was unreadable: byte counts are unknown, never zero.
  bool meminfo_known = 8;
}

message LoadMetrics {
  double load_1m = 1;
  double load_5m = 2;
  double load_15m = 3;
}

message ThermalMetrics {
  double cpu_celsius = 1;
  double gpu_celsius = 2;
  // Deprecated: never populated.
  double soc_celsius = 3 [deprecated = true];
  repeated ThermalZone zones = 4;
  // False when no thermal zone was readable: cpu_celsius is unknown, never 0.
  bool cpu_known = 5;
}

message ThermalZone {
  string name = 1;
  double celsius = 2;
}

message DiskMetrics {
  string mount_point = 1;
  string filesystem = 2;
  uint64 total_bytes = 3;
  uint64 used_bytes = 4;
  // Deprecated: disk rates are never populated.
  double read_bytes_per_sec = 5 [deprecated = true];
  double write_bytes_per_sec = 6 [deprecated = true];
  bool read_only = 7;
  bool nearly_full = 8;
  // Legacy scalar defaults are meaningful only when their observation is known.
  bool capacity_known = 9;
  bool mount_status_known = 10;
  string source_device = 11;
}

message NetworkInterfaceMetrics {
  string name = 1;
  bool up = 2;
  uint64 rx_bytes_per_sec = 3;
  uint64 tx_bytes_per_sec = 4;
  uint64 rx_errors_total = 5;
  uint64 tx_errors_total = 6;
  string can_state = 7;
  uint64 can_tx_error_count = 8;
  uint64 can_rx_error_count = 9;
  // False for a first sample, a counter reset, or a stalled sampler:
  // per-second rates are unknown, never zero.
  bool rates_valid = 10;
}

message ServiceStatus {
  string unit = 1;
  ServiceState state = 2;
  uint32 restarts = 3;
}

message PiPlatformMetrics {
  bool throttled_now = 1;
  uint32 throttle_events = 2;
  // Deprecated: arm_freq_mhz, core_freq_mhz, core_voltage_v, sdram_freq_mhz and
  // gpu_freq_mhz are never populated.
  uint32 arm_freq_mhz = 3 [deprecated = true];
  uint32 core_freq_mhz = 4 [deprecated = true];
  double core_voltage_v = 5 [deprecated = true];
  uint32 sdram_freq_mhz = 6 [deprecated = true];
  uint32 gpu_freq_mhz = 7 [deprecated = true];
  double pmic_temp_celsius = 8;
  // False when vcgencmd was unavailable: throttled_now/events unknown, never clear.
  bool throttle_known = 9;
}

message JetsonPlatformMetrics {
  string jetson_model = 1;
  string power_mode = 2;
  double gpu_usage_percent = 3;
  uint64 gpu_mem_used_bytes = 4;
  uint64 gpu_mem_total_bytes = 5;
  uint32 gpu_freq_mhz = 6;
  uint32 emc_freq_mhz = 7;
  double power_draw_w = 8;
  double chappe_rtt_ms = 9;
  bool chappe_connected = 10;
}

// --- Log store HTTP API (marengo-gateway + Consul) ---

message LogSessionMeta {
  string id = 1;
  string label = 2;
  uint64 started_ms = 3;
  uint64 ended_ms = 4;
  bool has_bench = 5;
  bool has_candump = 6;
  bool has_trace = 7;
  uint64 candump_bytes = 8;
  uint64 candump_frame_count = 9;
}

message LogSessionList {
  repeated LogSessionMeta sessions = 1;
}

message StructuredLogEntry {
  uint64 id = 1;
  uint64 timestamp_ms = 2;
  string level = 3;
  string target = 4;
  string message = 5;
  string session_id = 6;
  string fields_json = 7;
}

message StructuredLogList {
  repeated StructuredLogEntry entries = 1;
  uint32 total = 2;
}

message CandumpFrame {
  double delta_s = 1 [deprecated = true]; // populated with normalized offset
  string interface = 2;
  string can_id = 3;
  string data = 4;
  uint32 line_no = 5;

  optional uint64 timestamp_unix_us = 6;
  optional uint32 comm_type = 7;
  optional string comm_type_name = 8;
  optional string joint = 9;
  double offset_s = 10;
}

enum CandumpTimestampMode {
  CANDUMP_TIMESTAMP_MODE_UNSPECIFIED = 0;
  CANDUMP_TIMESTAMP_MODE_DELTA = 1;
  CANDUMP_TIMESTAMP_MODE_ABSOLUTE = 2;
}

message CandumpPage {
  repeated CandumpFrame frames = 1;
  uint32 total_frames = 2 [deprecated = true];
  uint32 offset = 3;
  CandumpTimestampMode timestamp_mode = 4;
  uint64 parsed_frames = 5;
  uint64 total_lines = 6;
}

message CandumpIdCount {
  string can_id = 1;
  uint64 count = 2;
}

message CandumpInterfaceSummary {
  string name = 1;
  uint64 parsed_frames = 2;
  optional double approx_hz = 3;
}

message CandumpSummary {
  // Existing fields 1..6 retained as compatibility projections.
  uint32 frame_count = 1 [deprecated = true];
  uint64 bytes = 2 [deprecated = true];
  double duration_s = 3;
  double approx_hz = 4 [deprecated = true];
  repeated string interfaces = 5 [deprecated = true];
  repeated string top_ids = 6 [deprecated = true];

  uint64 parsed_frames = 7;
  uint64 total_lines = 8;
  repeated CandumpIdCount top_id_counts = 9;
  repeated CandumpInterfaceSummary interface_summaries = 10;
  optional double parsed_frame_hz = 11;
  uint64 source_bytes = 12;
}

// --- Actuator harness (Consul / gateway / Pi overlay) ---

message SessionStartRequest {
  uint64 timestamp_ms = 1;
  string operator_id = 2;
}

message SessionStartResponse {
  string session_id = 1;
  uint64 started_ms = 2;
}

message OperatorCommand {
  uint64 timestamp_ms = 1;
  string session_id = 2;
  string operator_id = 3;
  uint64 seq = 4;
  ActuatorCommand command = 5;
}

message ActuatorCommand {
  string joint = 1;
  oneof payload {
    TuningChange tuning = 10;
    ModeChange mode = 11;
    JogCommand jog = 12;
    HoldCommand hold = 13;
    PresetCommand preset = 14;
    EnableChange enable = 15;
    LimitPatchCommand limit_patch = 16;
  }
}

/// Numerical hard/soft/velocity limits for an existing joint (hot-reload surface).
message LimitPatchCommand {
  double position_lower_rad = 1;
  double position_upper_rad = 2;
  optional double torque_limit_nm = 3;
  optional double position_soft_lower_rad = 4;
  optional double position_soft_upper_rad = 5;
  optional double velocity_max_rad_s = 6;
  /// CAS token from GET /config/profiles (content hash of bringup YAML).
  string expected_revision = 7;
}

/// Write-behind status for config mutations (limits / control overlay).
enum PersistStatus {
  PERSIST_STATUS_UNSPECIFIED = 0;
  PERSIST_STATUS_PENDING = 1;
  PERSIST_STATUS_DURABLE = 2;
  PERSIST_STATUS_FAILED = 3;
  PERSIST_STATUS_NOT_APPLICABLE = 4;
}

enum TuningTier {
  TUNING_TIER_UNSPECIFIED = 0;
  TUNING_TIER_RUNTIME_MIT = 1;
  TUNING_TIER_CONFIG_OVERLAY = 2;
  TUNING_TIER_FIRMWARE = 3;
}

message TuningChange {
  TuningTier tier = 1;
  string param = 2;
  double value = 3;
  bool persist = 4;
}

message ModeChange {
  ControlMode mode = 1;
}

message JogCommand {
  double delta_rad = 1;
}

message HoldCommand {
  bool engage = 1;
  double position_rad = 2;
}

message PresetCommand {
  string preset_id = 1;
}

message EnableChange {
  bool enable = 1;
}

message TuningChangeEvent {
  uint64 timestamp_ms = 1;
  string session_id = 2;
  string operator_id = 3;
  string joint = 4;
  TuningTier tier = 5;
  string param = 6;
  double before = 7;
  double after = 8;
  bool persist = 9;
}

message ActionEvent {
  uint64 timestamp_ms = 1;
  string session_id = 2;
  string operator_id = 3;
  string joint = 4;
  string action = 5;
  uint64 revision = 6;
  bool accepted = 7;
  string reject_reason = 8;
  PersistStatus persist_status = 9;
  /// Profile content revision after apply (CAS token for Consul).
  string config_revision = 10;
}

message JointActuatorLimit {
  string joint = 1;
  double kp_max = 2;
  double kd_max = 3;
  double velocity_max_rad_s = 4;
  double tau_ff_max_nm = 5;
  /// Davout effective hard envelope (URDF ∩ motors.yaml bench). Enable / fault SoT.
  double pos_lower_rad = 6;
  double pos_upper_rad = 7;
  bool wired = 8;
  /// Soft envelope from Davout policy (control soft, clamped into hard).
  double pos_soft_lower_rad = 9;
  double pos_soft_upper_rad = 10;
}

message ActuatorLimitSnapshot {
  uint64 timestamp_ms = 1;
  repeated JointActuatorLimit joints = 2;
}

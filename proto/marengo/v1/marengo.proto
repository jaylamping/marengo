syntax = "proto3";

package marengo.v1;

// Shared envelope metadata for Chappe topics (payload follows as encoded sub-message).
message Envelope {
  uint64 timestamp_ms = 1;
  string source_node = 2;
  string message_type = 3; // fully-qualified proto message name
  bytes payload = 4;
}

message Heartbeat {
  uint64 timestamp_ms = 1;
  string node_id = 2;
}

message JointState {
  string name = 1;
  double position = 2;
  double velocity = 3;
  double effort = 4;
  float temperature_c = 5;  // motor casing temperature (°C)
  uint32 fault = 6;         // Robstride fault bitmask
}

message RobotState {
  uint64 timestamp_ms = 1;
  repeated JointState joints = 2;
}

// --- Sensors (torso IMU on Pi I2C) ---

enum ImuAccuracy {
  IMU_ACCURACY_UNSPECIFIED = 0;
  IMU_ACCURACY_UNRELIABLE = 1;
  IMU_ACCURACY_LOW = 2;
  IMU_ACCURACY_MEDIUM = 3;
  IMU_ACCURACY_HIGH = 4;
}

message ImuSample {
  uint64 timestamp_ms = 1;
  string frame_id = 2;
  double quaternion_i = 3;
  double quaternion_j = 4;
  double quaternion_k = 5;
  double quaternion_real = 6;
  ImuAccuracy accuracy = 7;
  // Optional linear acceleration (m/s²) and gyro (rad/s) when enabled on device.
  double accel_x_m_s2 = 8;
  double accel_y_m_s2 = 9;
  double accel_z_m_s2 = 10;
  double gyro_x_rad_s = 11;
  double gyro_y_rad_s = 12;
  double gyro_z_rad_s = 13;
  bool has_accel = 14;
  bool has_gyro = 15;
}

// --- Safety / enable (Spot-style surface, Marengo semantics) ---

enum OperationalMode {
  OPERATIONAL_MODE_UNSPECIFIED = 0;
  OPERATIONAL_MODE_DISABLED = 1;
  OPERATIONAL_MODE_READY = 2;   // homed, drives may be enabled on request
  OPERATIONAL_MODE_ACTIVE = 3;  // tracking commanded motion
}

enum FaultSeverity {
  FAULT_SEVERITY_UNSPECIFIED = 0;
  FAULT_SEVERITY_WARNING = 1;
  FAULT_SEVERITY_FAULT = 2;
  FAULT_SEVERITY_ESTOP = 3;
}

message Fault {
  string code = 1;
  string message = 2;
  FaultSeverity severity = 3;
  string joint = 4; // optional, empty if robot-wide
}

message SafetyState {
  uint64 timestamp_ms = 1;
  OperationalMode mode = 2;
  bool hardware_estop_asserted = 3;
  bool software_estop_latched = 4;
  repeated Fault active_faults = 5;
}

message EnableRequest {
  uint64 timestamp_ms = 1;
  string operator_id = 2;
  // Request transition toward ACTIVE (must be in READY, E-stop clear).
  bool enable = 3;
}

message HomingComplete {
  uint64 timestamp_ms = 1;
  string node_id = 2;
}

// Firmware SetZero for one joint (mechanical reference already positioned).
message SetZeroRequest {
  uint64 timestamp_ms = 1;
  string operator_id = 2;
  string joint = 3;
  // Server-side gate: must be true (UI/agent confirm). Reject otherwise.
  bool confirm = 4;
  // Operator attestation that sign/direction was checked (homing.yaml may require it).
  bool sign_test_passed = 5;
}

// Per-joint Active Reporting (Robstride type-24) lease for diagnostics / free-drive sensing.
enum ActiveReportingLeaseAction {
  ACTIVE_REPORTING_LEASE_ACTION_UNSPECIFIED = 0;
  ACTIVE_REPORTING_LEASE_ACTION_ACQUIRE = 1;
  ACTIVE_REPORTING_LEASE_ACTION_RENEW = 2;
  ACTIVE_REPORTING_LEASE_ACTION_RELEASE = 3;
}

message ActiveReportingLeaseRequest {
  uint64 timestamp_ms = 1;
  string operator_id = 2;
  string joint = 3;
  // Session / workflow key (bounded by gateway). Not a security boundary.
  string client_id = 4;
  ActiveReportingLeaseAction action = 5;
  // Client-minted opaque id; required for renew/release. Acquire upserts this id.
  string lease_id = 6;
}

// --- Control / MIT (OpenArm-style; see ADR 0004) ---

enum ControlMode {
  CONTROL_MODE_UNSPECIFIED = 0;
  CONTROL_MODE_DISABLED = 1;
  CONTROL_MODE_GRAVITY_COMP = 2;
  CONTROL_MODE_IMPEDANCE = 3;
  CONTROL_MODE_POSITION = 4;
  CONTROL_MODE_TORQUE_ONLY = 5;
}

// One joint MIT command (maps to Robstride Mode 0 fields).
message MitJointCommand {
  string name = 1;
  double kp = 2;
  double kd = 3;
  double position = 4;
  double velocity = 5;
  double torque_ff = 6;
  double ki = 7;  // integral gain (Testing page)
  double fc = 8;  // Coulomb friction compensation (Testing page)
}

message MitCommandBatch {
  uint64 timestamp_ms = 1;
  ControlMode mode = 2;
  repeated MitJointCommand joints = 3;
}

// --- Operator gateway (Consul / marengo-gateway) ---

// First message on a WebTransport bidi stream: which Chappe topics to receive.
message GatewaySubscribe {
  repeated string topics = 1;
}

// Structured log line for Consul log surfaces (topic: logs/structured).
message LogEvent {
  uint64 timestamp_ms = 1;
  string level = 2;   // trace | debug | info | warn | error
  string target = 3;  // tracing target, e.g. berthier::loop
  string message = 4;
  string session_id = 5; // bench session id when MARENGO_LOG_SESSION_ID set
  string fields_json = 6; // JSON object of tracing structured fields; empty when none
}

// --- Host metrics (Consul host cards; topics host/metrics/pi | host/metrics/jetson) ---

enum HostNodeRole {
  HOST_NODE_ROLE_UNSPECIFIED = 0;
  HOST_NODE_ROLE_PI = 1;
  HOST_NODE_ROLE_JETSON = 2;
}

enum ServiceState {
  SERVICE_STATE_UNSPECIFIED = 0;
  SERVICE_STATE_ACTIVE = 1;
  SERVICE_STATE_INACTIVE = 2;
  SERVICE_STATE_FAILED = 3;
}

message HostMetrics {
  uint64 timestamp_ms = 1;
  string hostname = 2;
  HostNodeRole node_role = 3;
  uint64 uptime_sec = 4;
  string kernel_version = 5;
  string os_pretty_name = 6;
  BuildInfo build = 7;

  CpuMetrics cpu = 10;
  MemoryMetrics memory = 11;
  LoadMetrics load = 12;
  ThermalMetrics thermal = 13;
  repeated DiskMetrics disks = 14;
  repeated NetworkInterfaceMetrics network = 15;
  repeated ServiceStatus services = 16;
  ChappeHealth chappe = 17;
  ClockMetrics clock = 18;

  oneof platform {
    PiPlatformMetrics pi = 20;
    JetsonPlatformMetrics jetson = 21;
  }

  uint64 log_disk_bytes = 30;
  uint64 log_disk_budget_bytes = 31;
}

message BuildInfo {
  string deploy_rev = 1;
  string git_sha = 2;
  string semver = 3;
}

message ChappeHealth {
  bool ipc_connected = 1;
  bool gateway_reachable = 2;
  uint64 last_publish_age_ms = 3;
}

message ClockMetrics {
  string sync_source = 1;
  double offset_ms = 2;
  bool synchronized = 3;
}

message CpuMetrics {
  double usage_percent = 1;
  uint32 core_count = 2;
  repeated double per_core_usage_percent = 3;
  uint32 freq_mhz = 4;
  double iowait_percent = 5;
}

message MemoryMetrics {
  uint64 total_bytes = 1;
  uint64 used_bytes = 2;
  uint64 available_bytes = 3;
  uint64 buffers_bytes = 4;
  uint64 cached_bytes = 5;
  uint64 swap_total_bytes = 6;
  uint64 swap_used_bytes = 7;
}

message LoadMetrics {
  double load_1m = 1;
  double load_5m = 2;
  double load_15m = 3;
}

message ThermalMetrics {
  double cpu_celsius = 1;
  double gpu_celsius = 2;
  double soc_celsius = 3;
  repeated ThermalZone zones = 4;
}

message ThermalZone {
  string name = 1;
  double celsius = 2;
}

message DiskMetrics {
  string mount_point = 1;
  string filesystem = 2;
  uint64 total_bytes = 3;
  uint64 used_bytes = 4;
  double read_bytes_per_sec = 5;
  double write_bytes_per_sec = 6;
  bool read_only = 7;
  bool nearly_full = 8;
}

message NetworkInterfaceMetrics {
  string name = 1;
  bool up = 2;
  uint64 rx_bytes_per_sec = 3;
  uint64 tx_bytes_per_sec = 4;
  uint64 rx_errors_total = 5;
  uint64 tx_errors_total = 6;
  string can_state = 7;
  uint64 can_tx_error_count = 8;
  uint64 can_rx_error_count = 9;
}

message ServiceStatus {
  string unit = 1;
  ServiceState state = 2;
  uint32 restarts = 3;
}

message PiPlatformMetrics {
  bool throttled_now = 1;
  uint32 throttle_events = 2;
  uint32 arm_freq_mhz = 3;
  uint32 core_freq_mhz = 4;
  double core_voltage_v = 5;
  uint32 sdram_freq_mhz = 6;
  uint32 gpu_freq_mhz = 7;
  double pmic_temp_celsius = 8;
}

message JetsonPlatformMetrics {
  string jetson_model = 1;
  string power_mode = 2;
  double gpu_usage_percent = 3;
  uint64 gpu_mem_used_bytes = 4;
  uint64 gpu_mem_total_bytes = 5;
  uint32 gpu_freq_mhz = 6;
  uint32 emc_freq_mhz = 7;
  double power_draw_w = 8;
  double chappe_rtt_ms = 9;
  bool chappe_connected = 10;
}

// --- Log store HTTP API (marengo-gateway + Consul) ---

message LogSessionMeta {
  string id = 1;
  string label = 2;
  uint64 started_ms = 3;
  uint64 ended_ms = 4;
  bool has_bench = 5;
  bool has_candump = 6;
  bool has_trace = 7;
  uint64 candump_bytes = 8;
  uint64 candump_frame_count = 9;
}

message LogSessionList {
  repeated LogSessionMeta sessions = 1;
}

message StructuredLogEntry {
  uint64 id = 1;
  uint64 timestamp_ms = 2;
  string level = 3;
  string target = 4;
  string message = 5;
  string session_id = 6;
  string fields_json = 7;
}

message StructuredLogList {
  repeated StructuredLogEntry entries = 1;
  uint32 total = 2;
}

message CandumpFrame {
  double delta_s = 1;
  string interface = 2;
  string can_id = 3;
  string data = 4;
  uint32 line_no = 5;
}

message CandumpPage {
  repeated CandumpFrame frames = 1;
  uint32 total_frames = 2;
  uint32 offset = 3;
}

message CandumpSummary {
  uint32 frame_count = 1;
  uint64 bytes = 2;
  double duration_s = 3;
  double approx_hz = 4;
  repeated string interfaces = 5;
  repeated string top_ids = 6;
}

// --- Actuator harness (Consul / gateway / Pi overlay) ---

message SessionStartRequest {
  uint64 timestamp_ms = 1;
  string operator_id = 2;
}

message SessionStartResponse {
  string session_id = 1;
  uint64 started_ms = 2;
}

message OperatorCommand {
  uint64 timestamp_ms = 1;
  string session_id = 2;
  string operator_id = 3;
  uint64 seq = 4;
  ActuatorCommand command = 5;
}

message ActuatorCommand {
  string joint = 1;
  oneof payload {
    TuningChange tuning = 10;
    ModeChange mode = 11;
    JogCommand jog = 12;
    HoldCommand hold = 13;
    PresetCommand preset = 14;
    EnableChange enable = 15;
    LimitPatchCommand limit_patch = 16;
  }
}

/// Numerical hard/soft/velocity limits for an existing joint (hot-reload surface).
message LimitPatchCommand {
  double position_lower_rad = 1;
  double position_upper_rad = 2;
  optional double torque_limit_nm = 3;
  optional double position_soft_lower_rad = 4;
  optional double position_soft_upper_rad = 5;
  optional double velocity_max_rad_s = 6;
  /// CAS token from GET /config/profiles (content hash of bringup YAML).
  string expected_revision = 7;
}

/// Write-behind status for config mutations (limits / control overlay).
enum PersistStatus {
  PERSIST_STATUS_UNSPECIFIED = 0;
  PERSIST_STATUS_PENDING = 1;
  PERSIST_STATUS_DURABLE = 2;
  PERSIST_STATUS_FAILED = 3;
  PERSIST_STATUS_NOT_APPLICABLE = 4;
}

enum TuningTier {
  TUNING_TIER_UNSPECIFIED = 0;
  TUNING_TIER_RUNTIME_MIT = 1;
  TUNING_TIER_CONFIG_OVERLAY = 2;
  TUNING_TIER_FIRMWARE = 3;
}

message TuningChange {
  TuningTier tier = 1;
  string param = 2;
  double value = 3;
  bool persist = 4;
}

message ModeChange {
  ControlMode mode = 1;
}

message JogCommand {
  double delta_rad = 1;
}

message HoldCommand {
  bool engage = 1;
  double position_rad = 2;
}

message PresetCommand {
  string preset_id = 1;
}

message EnableChange {
  bool enable = 1;
}

message TuningChangeEvent {
  uint64 timestamp_ms = 1;
  string session_id = 2;
  string operator_id = 3;
  string joint = 4;
  TuningTier tier = 5;
  string param = 6;
  double before = 7;
  double after = 8;
  bool persist = 9;
}

message ActionEvent {
  uint64 timestamp_ms = 1;
  string session_id = 2;
  string operator_id = 3;
  string joint = 4;
  string action = 5;
  uint64 revision = 6;
  bool accepted = 7;
  string reject_reason = 8;
  PersistStatus persist_status = 9;
  /// Profile content revision after apply (CAS token for Consul).
  string config_revision = 10;
}

message JointActuatorLimit {
  string joint = 1;
  double kp_max = 2;
  double kd_max = 3;
  double velocity_max_rad_s = 4;
  double tau_ff_max_nm = 5;
  double pos_lower_rad = 6;
  double pos_upper_rad = 7;
  bool wired = 8;
}

message ActuatorLimitSnapshot {
  uint64 timestamp_ms = 1;
  repeated JointActuatorLimit joints = 2;
}

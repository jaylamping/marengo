syntax = "proto3";

package marengo.v1;

// Shared envelope metadata for Chappe topics (payload follows as encoded sub-message).
message Envelope {
  uint64 timestamp_ms = 1;
  string source_node = 2;
  string message_type = 3; // fully-qualified proto message name
  bytes payload = 4;
}

message Heartbeat {
  uint64 timestamp_ms = 1;
  string node_id = 2;
}

message JointState {
  string name = 1;
  double position = 2;
  double velocity = 3;
  double effort = 4;
}

message RobotState {
  uint64 timestamp_ms = 1;
  repeated JointState joints = 2;
}

// --- Sensors (torso IMU on Pi I2C) ---

enum ImuAccuracy {
  IMU_ACCURACY_UNSPECIFIED = 0;
  IMU_ACCURACY_UNRELIABLE = 1;
  IMU_ACCURACY_LOW = 2;
  IMU_ACCURACY_MEDIUM = 3;
  IMU_ACCURACY_HIGH = 4;
}

message ImuSample {
  uint64 timestamp_ms = 1;
  string frame_id = 2;
  double quaternion_i = 3;
  double quaternion_j = 4;
  double quaternion_k = 5;
  double quaternion_real = 6;
  ImuAccuracy accuracy = 7;
  // Optional linear acceleration (m/s²) and gyro (rad/s) when enabled on device.
  double accel_x_m_s2 = 8;
  double accel_y_m_s2 = 9;
  double accel_z_m_s2 = 10;
  double gyro_x_rad_s = 11;
  double gyro_y_rad_s = 12;
  double gyro_z_rad_s = 13;
  bool has_accel = 14;
  bool has_gyro = 15;
}

// --- Safety / enable (Spot-style surface, Marengo semantics) ---

enum OperationalMode {
  OPERATIONAL_MODE_UNSPECIFIED = 0;
  OPERATIONAL_MODE_DISABLED = 1;
  OPERATIONAL_MODE_READY = 2;   // homed, drives may be enabled on request
  OPERATIONAL_MODE_ACTIVE = 3;  // tracking commanded motion
}

enum FaultSeverity {
  FAULT_SEVERITY_UNSPECIFIED = 0;
  FAULT_SEVERITY_WARNING = 1;
  FAULT_SEVERITY_FAULT = 2;
  FAULT_SEVERITY_ESTOP = 3;
}

message Fault {
  string code = 1;
  string message = 2;
  FaultSeverity severity = 3;
  string joint = 4; // optional, empty if robot-wide
}

message SafetyState {
  uint64 timestamp_ms = 1;
  OperationalMode mode = 2;
  bool hardware_estop_asserted = 3;
  bool software_estop_latched = 4;
  repeated Fault active_faults = 5;
}

message EnableRequest {
  uint64 timestamp_ms = 1;
  string operator_id = 2;
  // Request transition toward ACTIVE (must be in READY, E-stop clear).
  bool enable = 3;
}

message HomingComplete {
  uint64 timestamp_ms = 1;
  string node_id = 2;
}

// --- Control / MIT (OpenArm-style; see ADR 0004) ---

enum ControlMode {
  CONTROL_MODE_UNSPECIFIED = 0;
  CONTROL_MODE_DISABLED = 1;
  CONTROL_MODE_GRAVITY_COMP = 2;
  CONTROL_MODE_IMPEDANCE = 3;
  CONTROL_MODE_POSITION = 4;
  CONTROL_MODE_TORQUE_ONLY = 5;
}

// One joint MIT command (maps to Robstride Mode 0 fields).
message MitJointCommand {
  string name = 1;
  double kp = 2;
  double kd = 3;
  double position = 4;
  double velocity = 5;
  double torque_ff = 6;
}

message MitCommandBatch {
  uint64 timestamp_ms = 1;
  ControlMode mode = 2;
  repeated MitJointCommand joints = 3;
}

// --- Operator gateway (Consul / marengo-gateway) ---

// First message on a WebTransport bidi stream: which Chappe topics to receive.
message GatewaySubscribe {
  repeated string topics = 1;
}

// Structured log line for Consul log surfaces (topic: logs/structured).
message LogEvent {
  uint64 timestamp_ms = 1;
  string level = 2;   // trace | debug | info | warn | error
  string target = 3;  // tracing target, e.g. berthier::loop
  string message = 4;
}

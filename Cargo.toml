[workspace]
resolver = "2"
members = [
    "crates/armee-proto",
    "crates/armee-kinematics",
    "crates/armee-dynamics",
    "crates/sim-harness",
    "crates/marengo-support",
    "crates/marengo-config",
    "crates/marengo-homing",
    "crates/chappe",
    "crates/berthier",
    "crates/davout",
    "crates/talleyrand",
    "crates/fouche",
    "crates/robstride",
    "bins/marengo-pi",
    "bins/marengo-gateway",
    "bins/marengo-jetson",
    "bins/probe",
    "bins/motor-repl",
    "bins/wave-demo",
    "bins/teleop",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
authors = ["Joey Lamping"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
tracing = "0.1"
prost = "0.13"
prost-build = "0.13"
urdf-rs = "0.8"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde_yaml = "0.9"
marengo-support = { path = "crates/marengo-support" }
marengo-config = { path = "crates/marengo-config" }
marengo-homing = { path = "crates/marengo-homing" }
armee-proto = { path = "crates/armee-proto" }
armee-kinematics = { path = "crates/armee-kinematics" }
armee-dynamics = { path = "crates/armee-dynamics" }
chappe = { path = "crates/chappe" }
berthier = { path = "crates/berthier" }
davout = { path = "crates/davout" }
talleyrand = { path = "crates/talleyrand" }
fouche = { path = "crates/fouche" }
robstride = { path = "crates/robstride" }
sim-harness = { path = "crates/sim-harness" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.dev]
split-debuginfo = "unpacked"

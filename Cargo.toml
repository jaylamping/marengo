[workspace]
resolver = "2"
members = [
    "crates/armee-proto",
    "crates/armee-kinematics",
    "crates/armee-dynamics",
    "crates/sim-harness",
    "crates/marengo-support",
    "crates/marengo-config",
    "crates/chappe",
    "crates/berthier",
    "crates/davout",
    "crates/robstride",
    "crates/marengo-imu",
    "crates/marengo-host-metrics",
    "crates/marengo-store",
    "crates/marengo-candump",
    "crates/marengo-deploy",
    "bins/marengo-pi",
    "bins/marengo-gateway",
    "bins/marengo-log-cli",
    "bins/marengo-limit-sync",
    "bins/motor-repl",
    "bins/imu-probe",
]

[workspace.package]
edition = "2021"
rust-version = "1.88"
authors = ["Joey Lamping"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
fs2 = "0.4"
same-file = "1"
rustc-hash = "2"
thiserror = "1"
proptest = "1"
tracing = "0.1"
prost = "0.13"
prost-build = "0.13"
urdf-rs = "0.8"
yaserde = "0.8"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde_yaml = "0.9"
marengo-support = { path = "crates/marengo-support" }
marengo-config = { path = "crates/marengo-config" }
armee-proto = { path = "crates/armee-proto" }
armee-kinematics = { path = "crates/armee-kinematics" }
armee-dynamics = { path = "crates/armee-dynamics" }
chappe = { path = "crates/chappe" }
berthier = { path = "crates/berthier" }
davout = { path = "crates/davout" }
robstride = { path = "crates/robstride" }
marengo-imu = { path = "crates/marengo-imu" }
marengo-host-metrics = { path = "crates/marengo-host-metrics" }
marengo-store = { path = "crates/marengo-store" }
marengo-candump = { path = "crates/marengo-candump", default-features = false }
marengo-deploy = { path = "crates/marengo-deploy" }
sim-harness = { path = "crates/sim-harness" }
time = { version = "0.3", features = ["std", "formatting"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.dev]
split-debuginfo = "unpacked"

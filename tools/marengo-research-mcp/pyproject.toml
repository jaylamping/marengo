[project]
name = "marengo-research-mcp"
version = "0.1.0"
description = "MCP server for humanoid robotics research and Marengo daily audit support"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.6.0",
    "httpx>=0.28.0",
    "trafilatura>=2.0.0",
    "markdownify>=0.14.0",
    "duckduckgo-search>=7.0.0",
    "arxiv>=2.1.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.25.0"]

[project.scripts]
marengo-research-mcp = "marengo_research_mcp.server:main"
marengo-research-cli = "marengo_research_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marengo_research_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: network tests (optional)",
]

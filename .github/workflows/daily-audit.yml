name: Daily audit

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # run.sh scans offline (--no-fetch); without the tool and a database the
      # result is "unavailable", which the audit reports as a warn finding.
      - name: Install cargo-audit and the RustSec advisory database
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          git clone --depth 1 https://github.com/rustsec/advisory-db "$HOME/.cargo/advisory-db"

      - name: Run daily audit
        run: |
          chmod +x scripts/daily-audit/run.sh scripts/daily-audit/issue-upsert.sh
          ./scripts/daily-audit/run.sh

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: daily-audit-${{ github.run_id }}
          path: var/log/daily-audit/**/*

      - name: Upsert GitHub issue
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ github.run_id }}
        run: |
          export DATE="$(date -u +%Y-%m-%d)"
          ./scripts/daily-audit/issue-upsert.sh

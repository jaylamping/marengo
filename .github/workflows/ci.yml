name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CI: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Capture runner uid/gid
        run: |
          echo "MARENGO_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "MARENGO_GID=$(id -g)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            .ci-cache/cargo/registry
            .ci-cache/cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'docker/Dockerfile.dev') }}-${{ github.run_id }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'docker/Dockerfile.dev') }}-
            cargo-${{ runner.os }}-

      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dev
          load: true
          tags: marengo-dev:local
          build-args: |
            MARENGO_UID=${{ env.MARENGO_UID }}
            MARENGO_GID=${{ env.MARENGO_GID }}
          cache-from: type=gha,scope=dev-image
          cache-to: type=gha,scope=dev-image,mode=max

      - name: Run check.sh in container
        run: |
          mkdir -p .ci-cache/cargo/registry .ci-cache/cargo/git target
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/.ci-cache/cargo/registry:/usr/local/cargo/registry" \
            -v "${{ github.workspace }}/.ci-cache/cargo/git:/usr/local/cargo/git" \
            -v "${{ github.workspace }}/target:/workspace/target" \
            -w /workspace \
            -e CI=true \
            -e GITHUB_EVENT_NAME="${{ github.event_name }}" \
            -e GITHUB_REPOSITORY="${{ github.repository }}" \
            marengo-dev:local \
            ./scripts/check.sh

  sim:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Capture runner uid/gid
        run: |
          echo "MARENGO_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "MARENGO_GID=$(id -g)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            .ci-cache/cargo/registry
            .ci-cache/cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'docker/Dockerfile.dev') }}-${{ github.run_id }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'docker/Dockerfile.dev') }}-
            cargo-${{ runner.os }}-

      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dev
          load: true
          tags: marengo-dev:local
          build-args: |
            MARENGO_UID=${{ env.MARENGO_UID }}
            MARENGO_GID=${{ env.MARENGO_GID }}
          cache-from: type=gha,scope=dev-image
          cache-to: type=gha,scope=dev-image,mode=max

      - name: Build sim image
        run: docker build -f docker/Dockerfile.sim -t marengo-sim:local .

      - name: Run check-sim.sh
        run: |
          mkdir -p .ci-cache/cargo/registry .ci-cache/cargo/git target
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/.ci-cache/cargo/registry:/usr/local/cargo/registry" \
            -v "${{ github.workspace }}/.ci-cache/cargo/git:/usr/local/cargo/git" \
            -v "${{ github.workspace }}/target:/workspace/target" \
            -w /workspace \
            -e MARENGO_SIM_MODEL=/workspace/sim/fixtures/minimal.xml \
            marengo-sim:local \
            ./scripts/check-sim.sh

  # Required gate: virtual CAN must work (same path as production SocketCAN via vcan0/vcan1).
  vcan:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Capture runner uid/gid
        run: |
          echo "MARENGO_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "MARENGO_GID=$(id -g)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            .ci-cache/cargo/registry
            .ci-cache/cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'docker/Dockerfile.dev') }}-${{ github.run_id }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'docker/Dockerfile.dev') }}-
            cargo-${{ runner.os }}-

      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dev
          load: true
          tags: marengo-dev:local
          build-args: |
            MARENGO_UID=${{ env.MARENGO_UID }}
            MARENGO_GID=${{ env.MARENGO_GID }}
          cache-from: type=gha,scope=dev-image
          cache-to: type=gha,scope=dev-image,mode=max

      - name: Load vcan kernel module
        run: ./scripts/ci-vcan-host-setup.sh

      - name: vcan integration tests
        run: |
          mkdir -p .ci-cache/cargo/registry .ci-cache/cargo/git target
          docker run --rm --privileged --network host \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/.ci-cache/cargo/registry:/usr/local/cargo/registry" \
            -v "${{ github.workspace }}/.ci-cache/cargo/git:/usr/local/cargo/git" \
            -v "${{ github.workspace }}/target:/workspace/target" \
            -w /workspace \
            -e MARENGO_USER=root \
            marengo-dev:local \
            bash -c './scripts/vcan-up.sh && ip -details link show vcan0 vcan1 && cargo test -p robstride --features socketcan -- --ignored'

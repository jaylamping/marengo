name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CI: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build dev image
        run: docker build -f docker/Dockerfile.dev -t marengo-dev:local .

      - name: Run check.sh in container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e CI=true \
            -e GITHUB_EVENT_NAME="${{ github.event_name }}" \
            -e GITHUB_REPOSITORY="${{ github.repository }}" \
            marengo-dev:local \
            ./scripts/check.sh

  sim:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Build sim image
        run: |
          docker build -f docker/Dockerfile.dev -t marengo-dev:local .
          docker build -f docker/Dockerfile.sim -t marengo-sim:local .

      - name: Run check-sim.sh
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e MARENGO_SIM_MODEL=/workspace/sim/fixtures/minimal.xml \
            marengo-sim:local \
            ./scripts/check-sim.sh

  vcan:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Build dev image
        run: docker build -f docker/Dockerfile.dev -t marengo-dev:local .

      - name: vcan integration tests
        run: |
          docker run --rm --privileged \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            marengo-dev:local \
            bash -c './scripts/vcan-up.sh && cargo test -p robstride --features vcan -- --ignored'

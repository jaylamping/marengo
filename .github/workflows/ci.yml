name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

env:
  CI: true
  DEV_IMAGE: ghcr.io/${{ github.repository_owner }}/marengo-dev

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      sim: ${{ steps.filter.outputs.sim }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            sim:
              - 'sim/**'
              - 'crates/sim-harness/**'
              - 'docker/Dockerfile.sim'
              - 'scripts/check-sim.sh'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/**'
              - 'bins/**'
              - 'proto/**'
              - '.github/workflows/ci.yml'

  # Ensure content-hash image exists on GHCR (skip rebuild on hit). No artifact handoff.
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      handoff: ${{ steps.handoff.outputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - name: Image metadata
        id: meta
        env:
          TAG: dev-${{ hashFiles('docker/Dockerfile.dev', 'docker/docker-entrypoint.sh', 'rust-toolchain.toml') }}
        run: |
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "DEV_IMAGE_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Same-repo push allowed
        id: push
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]] \
            || [[ "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image already exists
        id: exists
        run: |
          set -euo pipefail
          ref="${{ env.DEV_IMAGE }}:${{ env.DEV_IMAGE_TAG }}"
          if docker buildx imagetools inspect "${ref}" >/dev/null 2>&1; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "dev image cache hit: ${ref}"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "dev image cache miss: ${ref}"
          fi

      - name: Capture runner uid/gid
        if: steps.exists.outputs.hit != 'true'
        run: |
          echo "MARENGO_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "MARENGO_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Build and push dev image
        if: steps.exists.outputs.hit != 'true' && steps.push.outputs.allowed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dev
          push: true
          tags: ${{ env.DEV_IMAGE }}:${{ env.DEV_IMAGE_TAG }}
          build-args: |
            MARENGO_UID=${{ env.MARENGO_UID }}
            MARENGO_GID=${{ env.MARENGO_GID }}
          cache-from: |
            type=gha,scope=dev-image
            type=registry,ref=${{ env.DEV_IMAGE }}:latest
          cache-to: type=gha,scope=dev-image,mode=max

      - name: Point latest at new tag
        if: >-
          steps.exists.outputs.hit != 'true'
          && steps.push.outputs.allowed == 'true'
          && github.event_name == 'push'
          && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "${{ env.DEV_IMAGE }}:latest" \
            "${{ env.DEV_IMAGE }}:${{ env.DEV_IMAGE_TAG }}"

      # Fork PRs cannot push to GHCR — keep local load + artifact for that rare path.
      - name: Build and load dev image (fork)
        if: steps.exists.outputs.hit != 'true' && steps.push.outputs.allowed != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dev
          load: true
          tags: marengo-dev:local
          build-args: |
            MARENGO_UID=${{ env.MARENGO_UID }}
            MARENGO_GID=${{ env.MARENGO_GID }}
          cache-from: |
            type=gha,scope=dev-image
            type=registry,ref=${{ env.DEV_IMAGE }}:latest
          cache-to: type=gha,scope=dev-image,mode=max

      - name: Export dev image artifact (fork)
        if: steps.exists.outputs.hit != 'true' && steps.push.outputs.allowed != 'true'
        run: |
          set -euo pipefail
          docker save marengo-dev:local | zstd -T0 -o "${{ runner.temp }}/marengo-dev.tar.zst"
          ls -lh "${{ runner.temp }}/marengo-dev.tar.zst"

      - name: Upload dev image artifact (fork)
        if: steps.exists.outputs.hit != 'true' && steps.push.outputs.allowed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: marengo-dev-image
          path: ${{ runner.temp }}/marengo-dev.tar.zst
          retention-days: 1
          compression-level: 0

      - name: Set handoff mode
        id: handoff
        run: |
          if [[ "${{ steps.exists.outputs.hit }}" == "true" ]] \
            || [[ "${{ steps.push.outputs.allowed }}" == "true" ]]; then
            echo "mode=registry" >> "$GITHUB_OUTPUT"
          else
            echo "mode=artifact" >> "$GITHUB_OUTPUT"
          fi

  check:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/pull-dev-image
        if: needs.build-image.outputs.handoff == 'registry'
        with:
          image: ${{ env.DEV_IMAGE }}
          tag: ${{ needs.build-image.outputs.tag }}

      - uses: ./.github/actions/load-dev-image
        if: needs.build-image.outputs.handoff == 'artifact'

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            .ci-cache/cargo/registry
            .ci-cache/cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'docker/Dockerfile.dev') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # npm ci deletes node_modules; cache the download cache instead.
      - name: Restore npm download cache
        uses: actions/cache@v4
        with:
          path: .ci-cache/npm
          key: consul-npm-${{ runner.os }}-${{ hashFiles('consul/package-lock.json') }}
          restore-keys: |
            consul-npm-${{ runner.os }}-

      - name: Prepare proto breaking baseline
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p .ci-buf-against
          git archive "${{ github.event.pull_request.base.sha }}" proto | tar -x -C .ci-buf-against
          test -f .ci-buf-against/proto/marengo/v1/marengo.proto
          # Container mounts the workspace at /workspace (not github.workspace).
          echo "BUF_BREAKING_AGAINST=/workspace/.ci-buf-against/proto" >> "$GITHUB_ENV"

      - name: Run check.sh in container
        run: |
          mkdir -p .ci-cache/cargo/registry .ci-cache/cargo/git .ci-cache/npm target
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/.ci-cache/cargo/registry:/usr/local/cargo/registry" \
            -v "${{ github.workspace }}/.ci-cache/cargo/git:/usr/local/cargo/git" \
            -v "${{ github.workspace }}/.ci-cache/npm:/home/marengo/.npm" \
            -v "${{ github.workspace }}/target:/workspace/target" \
            -w /workspace \
            -e CI=true \
            -e npm_config_cache=/home/marengo/.npm \
            -e GITHUB_EVENT_NAME="${{ github.event_name }}" \
            -e GITHUB_BASE_SHA="${{ github.event.pull_request.base.sha || '' }}" \
            -e BUF_BREAKING_AGAINST="${{ env.BUF_BREAKING_AGAINST || '' }}" \
            -e GITHUB_REF="${{ github.ref }}" \
            -e GITHUB_REPOSITORY="${{ github.repository }}" \
            marengo-dev:local \
            ./scripts/check.sh

  sim:
    runs-on: ubuntu-latest
    needs: [build-image, changes]
    if: github.event_name == 'push' || needs.changes.outputs.sim == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/pull-dev-image
        if: needs.build-image.outputs.handoff == 'registry'
        with:
          image: ${{ env.DEV_IMAGE }}
          tag: ${{ needs.build-image.outputs.tag }}

      - uses: ./.github/actions/load-dev-image
        if: needs.build-image.outputs.handoff == 'artifact'

      - name: Restore Cargo cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .ci-cache/cargo/registry
            .ci-cache/cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'docker/Dockerfile.dev') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Build sim image
        run: docker build -f docker/Dockerfile.sim -t marengo-sim:local .

      - name: Run check-sim.sh
        run: |
          mkdir -p .ci-cache/cargo/registry .ci-cache/cargo/git target
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/.ci-cache/cargo/registry:/usr/local/cargo/registry" \
            -v "${{ github.workspace }}/.ci-cache/cargo/git:/usr/local/cargo/git" \
            -v "${{ github.workspace }}/target:/workspace/target" \
            -w /workspace \
            -e MARENGO_SIM_MODEL=/workspace/sim/fixtures/minimal.xml \
            marengo-sim:local \
            ./scripts/check-sim.sh

  # Required gate: virtual CAN must work (same path as production SocketCAN via vcan0/vcan1).
  vcan:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/pull-dev-image
        if: needs.build-image.outputs.handoff == 'registry'
        with:
          image: ${{ env.DEV_IMAGE }}
          tag: ${{ needs.build-image.outputs.tag }}

      - uses: ./.github/actions/load-dev-image
        if: needs.build-image.outputs.handoff == 'artifact'

      - name: Restore Cargo cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .ci-cache/cargo/registry
            .ci-cache/cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'docker/Dockerfile.dev') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Load vcan kernel module
        run: ./scripts/ci-vcan-host-setup.sh

      - name: vcan integration tests
        run: |
          mkdir -p .ci-cache/cargo/registry .ci-cache/cargo/git target
          for iface in vcan0 vcan1; do ip -details link show "${iface}"; done
          docker run --rm --privileged --network host \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/.ci-cache/cargo/registry:/usr/local/cargo/registry" \
            -v "${{ github.workspace }}/.ci-cache/cargo/git:/usr/local/cargo/git" \
            -v "${{ github.workspace }}/target:/workspace/target" \
            -v /lib/modules:/lib/modules:ro \
            -w /workspace \
            -e MARENGO_USER=root \
            marengo-dev:local \
            bash -c 'for iface in vcan0 vcan1; do ip -details link show "${iface}"; done && cargo test -p robstride --features socketcan -- --ignored'

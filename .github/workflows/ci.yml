name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

env:
  CI: true
  DEV_IMAGE: ghcr.io/${{ github.repository_owner }}/marengo-dev
  DEV_IMAGE_TAG: dev-${{ hashFiles('docker/Dockerfile.dev', 'rust-toolchain.toml') }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      sim: ${{ steps.filter.outputs.sim }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            sim:
              - 'sim/**'
              - 'crates/sim-harness/**'
              - 'docker/Dockerfile.sim'
              - 'scripts/check-sim.sh'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/**'
              - 'bins/**'
              - 'proto/**'
              - '.github/workflows/ci.yml'

  # Build once, push to GHCR (same-repo pushes/PRs), populate GHA layer cache.
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Capture runner uid/gid
        run: |
          echo "MARENGO_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "MARENGO_GID=$(id -g)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dev
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: |
            ${{ env.DEV_IMAGE }}:${{ env.DEV_IMAGE_TAG }}
            ${{ env.DEV_IMAGE }}:latest
          build-args: |
            MARENGO_UID=${{ env.MARENGO_UID }}
            MARENGO_GID=${{ env.MARENGO_GID }}
          cache-from: |
            type=gha,scope=dev-image
            type=registry,ref=${{ env.DEV_IMAGE }}:latest
          cache-to: type=gha,scope=dev-image,mode=max

  check:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Capture runner uid/gid
        run: |
          echo "MARENGO_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "MARENGO_GID=$(id -g)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve dev image
        id: dev-image
        run: |
          set -euo pipefail
          tagged="${{ env.DEV_IMAGE }}:${{ env.DEV_IMAGE_TAG }}"
          if docker pull "${tagged}"; then
            docker tag "${tagged}" marengo-dev:local
            echo "source=ghcr" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if docker pull "${{ env.DEV_IMAGE }}:latest"; then
            docker tag "${{ env.DEV_IMAGE }}:latest" marengo-dev:local
            echo "source=ghcr-latest" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "source=build" >> "$GITHUB_OUTPUT"

      - name: Build dev image fallback
        if: steps.dev-image.outputs.source == 'build'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dev
          load: true
          tags: marengo-dev:local
          build-args: |
            MARENGO_UID=${{ env.MARENGO_UID }}
            MARENGO_GID=${{ env.MARENGO_GID }}
          cache-from: |
            type=gha,scope=dev-image
            type=registry,ref=${{ env.DEV_IMAGE }}:latest

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            .ci-cache/cargo/registry
            .ci-cache/cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'docker/Dockerfile.dev') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Restore consul node_modules cache
        uses: actions/cache@v4
        with:
          path: consul/node_modules
          key: consul-npm-${{ runner.os }}-${{ hashFiles('consul/package-lock.json') }}
          restore-keys: |
            consul-npm-${{ runner.os }}-

      - name: Run check.sh in container
        run: |
          mkdir -p .ci-cache/cargo/registry .ci-cache/cargo/git target
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/.ci-cache/cargo/registry:/usr/local/cargo/registry" \
            -v "${{ github.workspace }}/.ci-cache/cargo/git:/usr/local/cargo/git" \
            -v "${{ github.workspace }}/target:/workspace/target" \
            -w /workspace \
            -e CI=true \
            -e GITHUB_EVENT_NAME="${{ github.event_name }}" \
            -e GITHUB_REF="${{ github.ref }}" \
            -e GITHUB_REPOSITORY="${{ github.repository }}" \
            marengo-dev:local \
            ./scripts/check.sh

  sim:
    runs-on: ubuntu-latest
    needs: [build-image, changes]
    if: github.event_name == 'push' || needs.changes.outputs.sim == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Capture runner uid/gid
        run: |
          echo "MARENGO_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "MARENGO_GID=$(id -g)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve dev image
        id: dev-image
        run: |
          set -euo pipefail
          tagged="${{ env.DEV_IMAGE }}:${{ env.DEV_IMAGE_TAG }}"
          if docker pull "${tagged}"; then
            docker tag "${tagged}" marengo-dev:local
            echo "source=ghcr" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if docker pull "${{ env.DEV_IMAGE }}:latest"; then
            docker tag "${{ env.DEV_IMAGE }}:latest" marengo-dev:local
            echo "source=ghcr-latest" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "source=build" >> "$GITHUB_OUTPUT"

      - name: Build dev image fallback
        if: steps.dev-image.outputs.source == 'build'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dev
          load: true
          tags: marengo-dev:local
          build-args: |
            MARENGO_UID=${{ env.MARENGO_UID }}
            MARENGO_GID=${{ env.MARENGO_GID }}
          cache-from: |
            type=gha,scope=dev-image
            type=registry,ref=${{ env.DEV_IMAGE }}:latest

      - name: Restore Cargo cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .ci-cache/cargo/registry
            .ci-cache/cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'docker/Dockerfile.dev') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Build sim image
        run: docker build -f docker/Dockerfile.sim -t marengo-sim:local .

      - name: Run check-sim.sh
        run: |
          mkdir -p .ci-cache/cargo/registry .ci-cache/cargo/git target
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/.ci-cache/cargo/registry:/usr/local/cargo/registry" \
            -v "${{ github.workspace }}/.ci-cache/cargo/git:/usr/local/cargo/git" \
            -v "${{ github.workspace }}/target:/workspace/target" \
            -w /workspace \
            -e MARENGO_SIM_MODEL=/workspace/sim/fixtures/minimal.xml \
            marengo-sim:local \
            ./scripts/check-sim.sh

  # Required gate: virtual CAN must work (same path as production SocketCAN via vcan0/vcan1).
  vcan:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v4

      - name: Capture runner uid/gid
        run: |
          echo "MARENGO_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "MARENGO_GID=$(id -g)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve dev image
        id: dev-image
        run: |
          set -euo pipefail
          tagged="${{ env.DEV_IMAGE }}:${{ env.DEV_IMAGE_TAG }}"
          if docker pull "${tagged}"; then
            docker tag "${tagged}" marengo-dev:local
            echo "source=ghcr" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if docker pull "${{ env.DEV_IMAGE }}:latest"; then
            docker tag "${{ env.DEV_IMAGE }}:latest" marengo-dev:local
            echo "source=ghcr-latest" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "source=build" >> "$GITHUB_OUTPUT"

      - name: Build dev image fallback
        if: steps.dev-image.outputs.source == 'build'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dev
          load: true
          tags: marengo-dev:local
          build-args: |
            MARENGO_UID=${{ env.MARENGO_UID }}
            MARENGO_GID=${{ env.MARENGO_GID }}
          cache-from: |
            type=gha,scope=dev-image
            type=registry,ref=${{ env.DEV_IMAGE }}:latest

      - name: Restore Cargo cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .ci-cache/cargo/registry
            .ci-cache/cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'docker/Dockerfile.dev') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Load vcan kernel module
        run: ./scripts/ci-vcan-host-setup.sh

      - name: vcan integration tests
        run: |
          mkdir -p .ci-cache/cargo/registry .ci-cache/cargo/git target
          for iface in vcan0 vcan1; do ip -details link show "${iface}"; done
          docker run --rm --privileged --network host \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/.ci-cache/cargo/registry:/usr/local/cargo/registry" \
            -v "${{ github.workspace }}/.ci-cache/cargo/git:/usr/local/cargo/git" \
            -v "${{ github.workspace }}/target:/workspace/target" \
            -v /lib/modules:/lib/modules:ro \
            -w /workspace \
            -e MARENGO_USER=root \
            marengo-dev:local \
            bash -c 'for iface in vcan0 vcan1; do ip -details link show "${iface}"; done && cargo test -p robstride --features socketcan -- --ignored'

services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    image: marengo-dev:local
    platform: linux/amd64
    working_dir: /workspace
    volumes:
      - .:/workspace
      - cargo-target:/workspace/target
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - consul-node-modules:/workspace/consul/node_modules
    stdin_open: true
    tty: true
    command: ["/bin/bash"]

  check:
    # Native host arch (no `platform` pin): the wall-clock 100 ms watchdog tests
    # starve under linux/amd64 emulation on Apple silicon. Own image tag and
    # target/node_modules volumes because those hold arch-specific artifacts.
    # CI runs check.sh in marengo-dev:local directly and is unaffected.
    image: marengo-check:local
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    working_dir: /workspace
    volumes:
      - .:/workspace
      - cargo-target-check:/workspace/target
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - consul-node-modules-check:/workspace/consul/node_modules
    command: ["bash", "./scripts/check.sh"]

  vcan:
    profiles: [vcan]
    image: marengo-dev:local
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    privileged: true
    network_mode: host
    working_dir: /workspace
    volumes:
      - .:/workspace
      - cargo-target:/workspace/target
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - consul-node-modules:/workspace/consul/node_modules
    command: ["bash", "-c", "./scripts/vcan-up.sh && exec sleep infinity"]
    restart: unless-stopped

  check-vcan:
    profiles: [vcan]
    image: marengo-dev:local
    depends_on:
      - vcan
    privileged: true
    working_dir: /workspace
    volumes:
      - .:/workspace
      - cargo-target:/workspace/target
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - consul-node-modules:/workspace/consul/node_modules
    network_mode: host
    command: ["bash", "-c", "./scripts/vcan-up.sh && for iface in vcan0 vcan1; do ip -details link show \"$$iface\"; done && cargo test --locked -p robstride --features socketcan -- --include-ignored --test-threads=1"]

  check-sim:
    profiles: [sim]
    build:
      context: .
      dockerfile: docker/Dockerfile.sim
    image: marengo-sim:local
    working_dir: /workspace
    volumes:
      - .:/workspace
      - cargo-target:/workspace/target
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - consul-node-modules:/workspace/consul/node_modules
    environment:
      MARENGO_SIM_MODEL: /workspace/sim/fixtures/minimal.xml
    command: ["bash", "./scripts/check-sim.sh"]

  deploy-pi:
    profiles: [deploy]
    image: marengo-dev:local
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    platform: linux/amd64
    working_dir: /workspace
    volumes:
      - .:/workspace
      - cargo-target:/workspace/target
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - consul-node-modules:/workspace/consul/node_modules

volumes:
  cargo-target:
  cargo-registry:
  cargo-git:
  consul-node-modules:
  cargo-target-check:
  consul-node-modules-check:
